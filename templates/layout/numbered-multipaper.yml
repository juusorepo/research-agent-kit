kit_layout: 0.1.0
kit_path: KIT_PATH
code: r
manuscript_format: quarto
preset: numbered-multipaper
papers:
  - id: PAPER_SLUG
    slug: PAPER_SLUG
paths:
  data: 01-data
  data_raw: 01-data/raw
  data_processed: 01-data/processed
  metadata: 01-data/metadata
  scripts: 02-scripts
  supplementary: 03-supplementary
  notebooks: 04-notebooks
  outputs: 05-outputs/{paper}
  outputs_figures: 05-outputs/{paper}/figures
  outputs_tables: 05-outputs/{paper}/tables
  manuscript: 05-outputs/{paper}/manuscript
  review_copy: 05-outputs/{paper}/manuscript/review-copy.yml
  docs: 06-docs/{paper}
  record: 07-record/{paper}
  archive: 99-archive
  paper_root: 07-record/{paper}
  overview: 07-record/{paper}/RESEARCH_CONTEXT.md
  analysis_plan: 07-record/{paper}/ANALYSIS_PLAN.md
  status: 07-record/{paper}/STATUS.md
  tasks: 07-record/{paper}/TASKS.md
  decisions: 07-record/{paper}/decisions
  proposals: 07-record/{paper}/proposals
  ai_use: 07-record/{paper}/ai-use
  notes: 07-record/{paper}/notes
  contributions: 07-record/{paper}/contributions
  audits: 07-record/{paper}/audits
  sources: 08-sources
  source_records: 07-record/{paper}/sources
# Co-author review channel is `provider` in review-copy.yml (`google-docs` default, or `word` to share a .docx on OneDrive).
# Sync the review copy and Ingest review comments stay Google Docs only.
