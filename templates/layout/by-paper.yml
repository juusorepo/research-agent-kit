kit_layout: 0.1.0
kit_path: KIT_PATH
code: r
manuscript_format: quarto
preset: by-paper
papers:
  - id: PAPER_SLUG
    slug: PAPER_SLUG
paths:
  docs: docs
  paper_root: papers/{paper}
  overview: papers/{paper}/RESEARCH_CONTEXT.md
  analysis_plan: papers/{paper}/ANALYSIS_PLAN.md
  status: papers/{paper}/STATUS.md
  tasks: papers/{paper}/TASKS.md
  decisions: papers/{paper}/decisions
  proposals: papers/{paper}/proposals
  ai_use: papers/{paper}/ai-use
  notes: papers/{paper}/notes
  contributions: papers/{paper}/contributions
  audits: papers/{paper}/audits
  sources: 08-sources
  source_records: papers/{paper}/sources
  scripts: papers/{paper}/analysis
  outputs: papers/{paper}/outputs
  manuscript: papers/{paper}/manuscript
  review_copy: papers/{paper}/manuscript/review-copy.yml
  metadata: papers/{paper}/outputs
# Co-author review channel is `provider` in review-copy.yml (`google-docs` default, or `word` to share a .docx on OneDrive).
# Sync the review copy and Ingest review comments stay Google Docs only.
# Optional: this paper’s Zotero collection (canonical). 08-sources is the materialised corpus (rebuildable later).
# To read Zotero on this computer, follow Find Zotero on this computer in the sync-project-sources skill (.rak/runtime/skills/ if present, otherwise the kit). Use curl. Do not use PowerShell Invoke-WebRequest.
