# Co-author review channel is `provider` in review-copy.yml (`google-docs` default, or `word` to share a .docx on OneDrive).
# Sync the review copy and Ingest review comments stay Google Docs only.
# Optional: this paper’s Zotero collection (canonical). 08-sources is the materialised corpus (rebuildable later).
# To read Zotero on this computer, follow Find Zotero on this computer in the sync-project-sources skill (.rak/runtime/skills/ if present, otherwise the kit). Use curl. Do not use PowerShell Invoke-WebRequest.
# zotero:
#   library: user
#   collection_key:
# Optional: NotebookLM connector. Do not guess tool names — set capabilities.
# notebooklm:
#   enabled: false
#   channel: local_corpus
#   capabilities:
#     query_grounded:
#     list_sources:
#     list_collections:
#     create_collection:
#     remove_collection:
#     research_sources:
#     research_status:
